detectors:
  port_scan:
    threshold_ports: 15
    window_seconds: 5
    cooldown_seconds: 60
  brute_force:
    ssh_threshold: 5
    ssh_window_seconds: 30
    http_threshold: 20
    http_window_seconds: 60
    https_threshold: 100
    https_window_seconds: 60
  syn_flood:
    ratio_medium: 10
    ratio_high: 50
    window_seconds: 5
    min_syn: 20
    cooldown_seconds: 60
  arp_spoof:
    gratuitous_threshold: 3
    gratuitous_window_seconds: 60
  dns_anomaly:
    query_threshold: 50
    query_window_seconds: 60
    subdomain_max_length: 50
    entropy_threshold: 3.5
    cooldown_seconds: 60
  baseline:
    interval_seconds: 10
    min_samples: 30
    z_medium: 3.0
    z_high: 5.0
    idle_evict_seconds: 3600
    deviation_max_age_seconds: 30

alerts:
  dedup_window_seconds: 60
  geoip:
    database_path: data/GeoLite2-City.mmdb
  pcap:
    buffer_seconds: 30
    max_packets: 20000
    output_dir: captures
    max_files: 50
  scoring:
    # Evidence – each term adds a bounded slice of points, and the three are summed.
    severity_points:
      LOW: 15
      MEDIUM: 25
      HIGH: 35
    frequency_max: 20      # points a fully saturated repeat count is worth
    frequency_cap: 64      # repeats at which the frequency term saturates
    deviation_max: 10      # points a fully saturated deviation is worth
    deviation_cap: 8.0     # z-score at which the deviation term saturates
    # Amplifier – multiplies the evidence total, then the score is clamped to 100.
    default_type_weight: 1.0
    type_weights:
      ARP_SPOOF: 1.8       # MITM – breaks the trust the whole segment relies on
      SYN_FLOOD: 1.5
      PORT_SCAN: 1.2
      BRUTE_FORCE: 1.0
      DNS_ANOMALY: 0.9
      BASELINE_ANOMALY: 1.0

database:
  path: sentinel.db
  packet_retention_hours: 48
  packet_batch_size: 500     # rows per transaction when the packet log is busy...
  packet_flush_seconds: 1    # ...and the longest a quiet packet waits to be written
  packet_cleanup_seconds: 60 # how often (packet time) the retention delete runs

network:
  interface: auto

ui:
  score_high: 70
  score_medium: 40
  dashboard_startup_seconds: 10   # how long 'd' waits for a dashboard it started to listen

web:
  host: 127.0.0.1
  port: 8888
  poll_seconds: 1
  alert_history_seconds: 3600
  traffic_seconds: 120       # the traffic chart's span, one point per second
  top_sources: 5             # how many talkers the dashboard ranks...
  top_sources_seconds: 300   # ...by packets sent over this window
  alert_stats_hours: 24      # span of the per-hour and per-type alert charts
  incident_limit: 100        # most rows one incident-log query returns

response:
  direction: in          # in / out / both – which way to drop the blocked IP's traffic
  whitelist:             # IPs that can never be blocked
    - 127.0.0.1          # localhost
    - 192.168.1.1        # default gateway – blocking it would cut internet
