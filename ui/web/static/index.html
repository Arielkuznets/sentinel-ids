<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL IDS — Dashboard</title>

    <!-- JetBrains Mono, the same font the TUI uses. Falls back to the system
         monospace face if there is no internet (see dashboard.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/dashboard.css">

    <!-- Chart.js must be defined before dashboard.js runs. `defer` makes both
         execute only after the DOM is parsed, and in document order — so the
         chart library is ready, and our script never reads a null element. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4" defer></script>
    <script src="/static/dashboard.js" defer></script>
</head>
<body>
    <header class="topbar">
        <h1>SENTINEL<span class="accent">_IDS</span></h1>
        <div class="status">
            <span id="connection-status" class="offline">CONNECTING…</span>
            <span class="metric">PKT/S: <span id="packet-rate">–</span></span>
            <span class="metric">ALERTS: <span id="alert-count">0</span></span>
        </div>
    </header>

    <main class="layout">
        <!-- The incident log: live alerts arrive over the WebSocket, and changing a
             filter re-reads history from /api/alerts. -->
        <section class="panel alerts-panel">
            <h2>INCIDENT LOG</h2>
            <div class="filters" id="filters">
                <select id="filter-type" aria-label="attack type">
                    <option value="">all types</option>
                    <option>PORT_SCAN</option>
                    <option>ARP_SPOOF</option>
                    <option>BRUTE_FORCE</option>
                    <option>DNS_ANOMALY</option>
                    <option>SYN_FLOOD</option>
                    <option>BASELINE_ANOMALY</option>
                </select>
                <select id="filter-severity" aria-label="severity">
                    <option value="">all severities</option>
                    <option>HIGH</option>
                    <option>MEDIUM</option>
                    <option>LOW</option>
                </select>
                <select id="filter-range" aria-label="time range">
                    <option value="3600">last hour</option>
                    <option value="86400">last 24 hours</option>
                    <option value="604800">last 7 days</option>
                </select>
            </div>
            <ul id="alert-list" class="alert-list"></ul>
        </section>

        <!-- The aggregates, redrawn from /api/stats every few seconds. Each heading
             names its window, filled in from the same payload. -->
        <div class="side">
            <section class="panel wide">
                <h2>TRAFFIC · PACKETS/S <span class="window" data-window="traffic"></span></h2>
                <div class="chart-box"><canvas id="traffic-chart"></canvas></div>
            </section>
            <section class="panel">
                <h2>ALERTS BY TYPE <span class="window" data-window="alerts"></span></h2>
                <div class="chart-box"><canvas id="type-chart"></canvas></div>
            </section>
            <section class="panel">
                <h2>ALERTS PER HOUR <span class="window" data-window="alerts"></span></h2>
                <div class="chart-box"><canvas id="hourly-chart"></canvas></div>
            </section>
            <section class="panel">
                <h2>TOP TALKERS <span class="window" data-window="talkers"></span></h2>
                <ul id="talker-list" class="side-list"></ul>
            </section>
            <section class="panel">
                <h2>BLOCKED IPS</h2>
                <ul id="blocked-list" class="side-list"></ul>
            </section>
        </div>
    </main>
</body>
</html>
